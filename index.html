<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Flight Deck Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Aviation applicant portfolio with Airi, an AI assistant you can ask questions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: a night approach seen through a HUD — the page is one flight from pre-flight to landing,
   each section a phase on the flight-plan strip; paper documents (boarding pass, checklist, logbook) sit on the instrument panel */
:root{
  --sky-0:#050c1a; --sky-1:#0a162b; --sky-2:#0f2140; --sky-3:#173057;
  --ink:#e4edf8; --ink-2:#9aacc4; --ink-3:#64798f;
  --hud:#5ce1ff; --hud-dim:rgba(92,225,255,.12);
  --line:rgba(140,200,255,.15); --line-2:rgba(140,200,255,.30);
  --amber:#ffb547; --on-amber:#1d1300; --ok:#5ef2a8; --route:#ff4fd8;
  --paper:#eef3f8; --paper-ink:#0c1a2d; --paper-2:#5a6b80; --paper-line:#c3cfdc;
  --sign:#f6c932; --sign-bg:#121212;
  --scrim:rgba(5,12,26,.9);
  --shadow:0 22px 60px rgba(0,0,0,.5);
  --f-display:"Chakra Petch","IBM Plex Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Thai","Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
  color-scheme:dark;
}
/* ไฟห้องนักบินโหมดกลางวัน (ปุ่ม DAY) */
:root[data-panel="day"]{
  --sky-0:#e8eff6; --sky-1:#f8fbfe; --sky-2:#dbe6f1; --sky-3:#c2d4e6;
  --ink:#0b1a2e; --ink-2:#44586f; --ink-3:#71849b;
  --hud:#06739a; --hud-dim:rgba(6,115,154,.08);
  --line:rgba(16,50,92,.13); --line-2:rgba(16,50,92,.25);
  --amber:#9c5a00; --on-amber:#ffffff; --ok:#0a7f51; --route:#bf138d;
  --paper:#ffffff; --paper-ink:#0c1a2d; --paper-2:#5a6b80; --paper-line:#cfd9e4;
  --scrim:rgba(232,239,246,.92);
  --shadow:0 22px 50px rgba(16,40,80,.18);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sky-0);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--sky-0)}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:var(--hud);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);letter-spacing:.06em}
.wrap{width:100%;max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ph{color:inherit;text-decoration:underline dashed 1.5px var(--amber);text-underline-offset:5px;cursor:help}
.paper .ph{text-decoration-color:#c27000}
.th{font-family:var(--f-body);letter-spacing:0;text-transform:none}

/* ------------------------------------------------------------ แถบบน + แผนการบิน */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--sky-0) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:18px;min-height:62px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand svg{width:26px;height:26px;color:var(--hud)}
.brand b{font-family:var(--f-display);font-size:17px;letter-spacing:.04em}
.brand small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--ink-3);line-height:1.2}
.fpl{flex:1;min-width:0;order:2}
.fpl ol{list-style:none;margin:0;padding:0 6px;display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.fpl ol::before{content:"";position:absolute;left:18px;right:18px;top:9px;height:2px;background:repeating-linear-gradient(90deg,var(--route) 0 8px,transparent 8px 13px);opacity:.75}
.fpl li{position:relative;z-index:1}
.fpl a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--ink-3);padding:0 4px;min-width:40px}
.fpl .wp{width:12px;height:12px;margin-top:3px;background:var(--sky-0);border:2px solid currentColor;transform:rotate(45deg)}
.fpl .code{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em}
.fpl .nm{font-size:11px;color:var(--ink-3);white-space:nowrap}
.fpl a.done{color:var(--hud)}
.fpl a.on{color:var(--amber)}
.fpl a.on .wp{background:var(--amber)}
.fpl a:hover{color:var(--ink)}
.fpl li.plane{position:absolute;top:0;left:18px;width:20px;height:20px;color:var(--ink);transform:translateX(-50%);transition:left .25s ease-out;pointer-events:none;z-index:2}
.plane svg{width:20px;height:20px;transform:rotate(90deg)}
.ctl{display:flex;gap:8px;align-items:center;order:3;margin-left:auto}
.seg{display:flex;border:1px solid var(--line-2)}
.seg button{background:transparent;border:0;padding:5px 9px;font-family:var(--f-mono);font-size:12px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--hud);color:var(--sky-0)}
.switch{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--line-2);padding:5px 10px 5px 6px;cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--ink-2)}
.switch .k{width:30px;height:16px;border-radius:8px;background:var(--sky-3);position:relative}
.switch .k::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--amber);transition:transform .2s}
.switch[aria-pressed="true"] .k::after{transform:translateX(14px)}
@media (max-width:1080px){.fpl .nm{display:none}}
@media (max-width:760px){
  .top-in{gap:10px;padding-block:8px}
  .fpl{order:4;flex-basis:100%}
  .brand small{display:none}
}

/* ------------------------------------------------------------ hero */
.hero{position:relative;isolation:isolate;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--scrim) 0%,color-mix(in srgb,var(--scrim) 60%,transparent) 38%,transparent 62%)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,80px);align-items:end;padding-block:clamp(56px,8vw,104px) clamp(36px,5vw,64px)}
.eyebrow{color:var(--amber);font-size:12px;text-transform:uppercase;letter-spacing:.2em}
.hero-name{font-size:clamp(38px,5.6vw,66px);font-weight:700;margin-top:12px;letter-spacing:.005em}
.hero-role{margin-top:14px;font-family:var(--f-display);font-weight:600;font-size:clamp(17px,1.9vw,21px);color:var(--hud);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.hero-role .arrow{color:var(--ink-3)}
.hero-tag{margin-top:14px;max-width:44ch;color:var(--ink-2);font-size:17px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:11px 18px;font-family:var(--f-display);font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;border:1px solid var(--line-2);background:transparent;color:var(--ink)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--amber);color:var(--on-amber);border-color:var(--amber);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn:hover{border-color:var(--hud)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--on-amber)}
.checks{display:flex;flex-wrap:wrap;gap:6px 18px;margin:28px 0 0;padding:0;list-style:none;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--ink-2)}
.checks li{display:flex;align-items:center;gap:7px}
.checks li::before{content:"";width:8px;height:8px;background:var(--ok);animation:lamp .5s steps(2,jump-none) both;animation-delay:calc(var(--i) * .35s + .2s)}
@keyframes lamp{from{background:var(--ink-3)}to{background:var(--ok)}}
.metar-band{background:var(--sky-0);border-bottom:1px solid var(--line)}
.metar{display:flex;gap:12px;align-items:center;padding-block:12px;font-size:12px;color:var(--ink-3);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.metar .th{font-size:13px}
.metar b{color:var(--ok);font-weight:500}
@media (max-width:900px){
  .hero-grid{grid-template-columns:minmax(0,1fr);align-items:start}
  .hero::before{background:linear-gradient(180deg,var(--scrim) 0%,color-mix(in srgb,var(--scrim) 72%,transparent) 55%,color-mix(in srgb,var(--scrim) 40%,transparent))}
}

/* บัตรขึ้นเครื่อง */
.pass{--stub:136px;position:relative;display:grid;grid-template-columns:minmax(0,1fr) var(--stub);background:var(--paper);color:var(--paper-ink);border-radius:12px;box-shadow:var(--shadow);transform:rotate(-1.4deg);max-width:580px;width:100%;justify-self:end}
.pass::before,.pass::after{content:"";position:absolute;right:calc(var(--stub) - 10px);width:20px;height:20px;border-radius:50%;background:var(--sky-0)}
.pass::before{top:-10px}.pass::after{bottom:-10px}
.pass-main{padding:16px 20px 16px;min-width:0;display:grid;gap:12px}
.pass-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--paper-line)}
.pass-head b{font-family:var(--f-mono);font-size:12px;letter-spacing:.22em}
.pass-head span{font-size:12px;color:var(--paper-2)}
.pass-body{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center}
.pass-photo{margin:0;width:96px;aspect-ratio:3/4;border-radius:6px;overflow:hidden;background:#d7e0ea}
.pass-photo img,.pass-photo .phimg{width:100%;height:100%;object-fit:cover}
.pk{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;color:var(--paper-2);text-transform:uppercase}
.pass-pax b{display:block;font-family:var(--f-display);font-size:19px;line-height:1.3;overflow-wrap:anywhere}
.route-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;margin-top:10px}
.apt b{display:block;font-family:var(--f-display);font-size:32px;line-height:1;letter-spacing:.02em}
.apt small{display:block;font-size:11px;color:var(--paper-2);line-height:1.35;max-width:12ch}
.apt.to{text-align:right}.apt.to small{margin-left:auto}
.leg{position:relative;height:20px}
.leg::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dotted var(--paper-line)}
.leg svg{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%) rotate(90deg);color:var(--paper-ink);background:var(--paper)}
.pass-fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0;padding-top:10px;border-top:1px solid var(--paper-line)}
.pass-fields div{min-width:0}
.pass-fields dt{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;color:var(--paper-2)}
.pass-fields dd{margin:0;font-family:var(--f-mono);font-weight:600;font-size:15px;overflow-wrap:anywhere}
.pass-stub{border-left:2px dashed var(--paper-line);padding:16px 14px;display:grid;align-content:space-between;gap:10px;min-width:0}
.pass-stub b{display:block;font-family:var(--f-mono);font-size:14px;overflow-wrap:anywhere}
.barcode{width:100%;height:56px;color:var(--paper-ink)}
@media (max-width:560px){
  .pass{grid-template-columns:minmax(0,1fr);transform:none}
  .pass::before,.pass::after{display:none}
  .pass-stub{border-left:0;border-top:2px dashed var(--paper-line);grid-template-columns:1fr 1fr;align-items:end}
  .pass-stub .barcode{grid-column:1/-1;height:44px}
  .pass-fields{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pass-body{grid-template-columns:80px minmax(0,1fr)}
  .pass-photo{width:80px}
  .apt b{font-size:26px}
}

/* ------------------------------------------------------------ หัวข้อแต่ละช่วงบิน */
.sec{padding-block:clamp(64px,8vw,108px);border-bottom:1px solid var(--line);scroll-margin-top:70px}
.sec.alt{background:var(--sky-1)}
.sec-head{display:grid;gap:12px;margin-bottom:clamp(28px,4vw,48px)}
.phase{display:flex;align-items:center;gap:12px;color:var(--amber);font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.phase .fix{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--hud)}
.phase .rule{flex:1;height:1px;background:var(--line-2)}
.sec h2{font-size:clamp(28px,3.8vw,42px)}
.sec-sub{color:var(--ink-2);max-width:62ch}
#awards{scroll-margin-top:90px}
@media (max-width:760px){.sec{scroll-margin-top:112px}#awards{scroll-margin-top:124px}}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:inset 0 0 0 2px var(--amber)}100%{box-shadow:inset 0 0 0 2px transparent}}
h3.sub{font-size:20px;display:flex;align-items:center;gap:10px;margin:48px 0 18px}
h3.sub::after{content:"";flex:1;height:1px;background:var(--line)}

/* PRE-FLIGHT */
.pf{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(28px,4vw,64px);align-items:start}
.about{font-size:18px;line-height:1.8;max-width:60ch}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:36px}
.gauge{display:grid;justify-items:center;text-align:center;gap:4px;padding:14px 8px 12px;border:1px solid var(--line);background:linear-gradient(180deg,var(--hud-dim),transparent 70%)}
.gauge svg{width:100%;max-width:150px;height:auto;overflow:visible}
.gauge .lbl{font-family:var(--f-display);font-weight:600;font-size:15px}
.gauge .note{font-size:12.5px;color:var(--ink-2);line-height:1.45}
.g-face{fill:var(--sky-0);stroke:var(--line-2);stroke-width:1}
.g-tick{stroke:var(--ink-3);stroke-width:1.2}
.g-tick.major{stroke:var(--ink-2);stroke-width:2}
.g-num{fill:var(--ink-3);font-family:var(--f-mono);font-size:9px}
.g-arc{fill:none;stroke:var(--hud);stroke-width:5;stroke-linecap:butt}
.g-seg{fill:none;stroke:var(--sky-3);stroke-width:9}
.g-seg.on{stroke:var(--hud)}
.g-needle{stroke:var(--amber);stroke-width:2.6;stroke-linecap:round;transform-origin:75px 75px;transform:rotate(var(--a));animation:settle 1.1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes settle{from{transform:rotate(calc(var(--a) - 26deg))}to{transform:rotate(var(--a))}}
.g-hub{fill:var(--amber)}
.g-val{fill:var(--ink);font-family:var(--f-mono);font-size:17px;font-weight:600;text-anchor:middle}
.g-big{fill:var(--ink);font-family:var(--f-display);font-size:30px;font-weight:700;text-anchor:middle}
.ph-t{fill:var(--amber)}
.g-cap{fill:var(--ink-3);font-family:var(--f-mono);font-size:8.5px;letter-spacing:.14em;text-anchor:middle}
.checklist{border:1px solid var(--line-2);background:var(--sky-2)}
.checklist > header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--amber);color:var(--on-amber);font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;font-weight:600}
.checklist > header .th{font-size:13px;font-weight:600;margin-left:8px}
.cl-group{padding:14px 16px 6px}
.cl-group + .cl-group{border-top:1px solid var(--line)}
.cl-group h3{font-family:var(--f-display);font-size:13px;letter-spacing:.02em;color:var(--hud);margin-bottom:6px;font-weight:600}
.cl-row{display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:15px}
.cl-row .nm{min-width:0}
.cl-row .lead{flex:1;min-width:24px;border-bottom:1px dotted var(--ink-3);transform:translateY(-5px)}
.cl-row .st{font-family:var(--f-mono);font-size:13px;color:var(--ok);white-space:nowrap}
@media (max-width:900px){.pf{grid-template-columns:minmax(0,1fr)}}

/* TAXI */
.taxi{display:grid;gap:16px;position:relative;padding-left:64px;max-width:860px}
.taxi::before{content:"";position:absolute;left:22px;top:6px;bottom:6px;width:4px;background:repeating-linear-gradient(180deg,var(--sign) 0 16px,transparent 16px 28px)}
.taxi-item{position:relative;padding:16px 20px 18px;border:1px solid var(--line);background:var(--sky-0)}
.sec.alt .taxi-item{background:var(--sky-0)}
.sign{position:absolute;left:-64px;top:14px;width:48px;height:42px;display:grid;place-items:center;background:var(--sign-bg);color:var(--sign);border:2px solid var(--sign);font:700 22px/1 var(--f-display)}
.yrs{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.04em;color:var(--amber)}
.taxi-item h3{font-size:20px;margin-top:4px}
.place{color:var(--hud);font-weight:500;margin-top:2px}
.detail{color:var(--ink-2);margin-top:6px}

/* TAKEOFF */
.why{font-family:var(--f-display);font-size:clamp(20px,2.3vw,26px);line-height:1.65;font-weight:500;max-width:36em}
.calls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:44px}
.call{border-top:2px solid var(--hud);padding-top:14px}
.call .c{font-family:var(--f-mono);color:var(--amber);font-size:12px;letter-spacing:.18em}
.call h3{font-size:19px;margin-top:8px}
.call p{color:var(--ink-2);margin-top:6px}
@media (max-width:820px){.calls{grid-template-columns:minmax(0,1fr)}}

/* CLIMB — สมุดบันทึก */
.logwrap{overflow-x:auto;border:1px solid var(--line-2);background:var(--sky-0)}
table.log{width:100%;border-collapse:collapse;min-width:780px;font-size:15px}
.log th{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;font-weight:500;text-align:left;color:var(--ink-2);background:var(--sky-2);padding:10px 12px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line);vertical-align:bottom;white-space:nowrap}
.log th small{display:block;font-family:var(--f-body);letter-spacing:0;font-size:12px;color:var(--ink-3);text-transform:none}
.log td{padding:12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top}
.log td:last-child,.log th:last-child{border-right:0}
.log .d{font-family:var(--f-display);font-weight:600;font-size:14px;white-space:nowrap;color:var(--amber)}
.log .t{font-weight:600}
.log .n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.log tfoot td{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--ink-2);background:var(--sky-2);border-bottom:0}
.log tfoot .n{color:var(--ink);font-size:15px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:1px solid var(--line-2);color:var(--hud);padding:3px 8px;font-family:var(--f-mono);font-size:11px;cursor:pointer;margin-top:6px}
.icon-btn svg{width:14px;height:14px}
@media (max-width:720px){
  table.log{min-width:0}
  .log thead{display:none}
  .log tbody tr{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .log td{border:0;padding:0}
  .log td.t{font-size:17px}
  .log td.n::before{content:attr(data-l) " · ";color:var(--ink-3);font-family:var(--f-body)}
  .log td.n{text-align:left}

// ---------------------------------------------------------------- ตัวช่วย
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function tx(v, L = LANG) {
  if (v == null) return "";
  if (typeof v === "string" || typeof v === "number") return String(v);
  if (Array.isArray(v)) return v;
  const out = v[L] ?? v.th ?? v.en;
  return out == null ? "" : out;
}
const plain = (v, L) => String(tx(v, L)).replace(/\[([^\]]*)\]/g, "$1");
const hasPh = (v, L) => /\[[^\]]+\]/.test(String(tx(v, L)));
function fmt(v, L) {
  return esc(tx(v, L)).replace(/\[([^\]]+)\]/g, (_m, inner) => { PH++; return `<span class="ph" title="${esc(U().phTip)}">${inner}</span>`; });
}
function svgTxt(v) { if (hasPh(v)) { PH++; return `<tspan class="ph-t">${esc(plain(v))}</tspan>`; } return esc(plain(v)); }
const num = (v) => parseFloat(String(tx(v)).replace(/[^\d.\-]/g, ""));
const list = (v) => (Array.isArray(v) ? v : []);
const owner = (L = LANG) => plain(A.ownerCall || C.nickname || "", L) || (L === "en" ? "the owner" : "เจ้าของเว็บ");
const ownerFmt = (L = LANG) => fmt(A.ownerCall || C.nickname || "", L);

function img(src, alt, kind, cls = "") {
  if (!src) return phImg(kind, "", cls);
  return `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" data-kind="${kind}" class="${cls}">`;
}
function phImg(kind, src, cls = "") {
  const icon = kind === "person" ? ICON.person : ICON.photo;
  const name = src ? String(src).split("/").pop() : "";
  return `<div class="phimg ${cls}" role="img" aria-label="${esc(U().imgMissing)}">${icon}<span>${esc(U().imgMissing)}${name ? "<br>" + esc(name) : ""}</span></div>`;
}
function armImages(root = document) {
  $$("img[data-kind]", root).forEach((el) => {
    if (el.dataset.armed) return;
    el.dataset.armed = "1";
    const fail = () => {
      const tmp = document.createElement("div");
      tmp.innerHTML = phImg(el.dataset.kind, el.getAttribute("src"), el.className);
      el.replaceWith(tmp.firstElementChild);
    };
    el.addEventListener("error", fail, { once: true });
    el.addEventListener("load", () => el.classList.add("ok"), { once: true });
    if (el.complete && el.naturalWidth > 0) el.classList.add("ok");
    else if (el.complete && el.getAttribute("src")) fail();
  });
}
function barcode(seed) {
  let h = 2166136261;
  for (const ch of String(seed)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; }
  let x = 0, bars = "";
  for (let i = 0; i < 64 && x < 300; i++) {
    h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
    const w = 1 + (h % 4), gap = 1 + ((h >>> 8) % 3);
    bars += `<rect x="${x}" y="0" width="${w}" height="56"/>`;
    x += w + gap;
  }
  return `<svg class="barcode" viewBox="0 0 ${x} 56" preserveAspectRatio="none" fill="currentColor" aria-hidden="true">${bars}</svg>`;
}

// ---------------------------------------------------------------- หน้าปัดเครื่องวัด
function gauge(st) {
  const cx = 75, cy = 75, R = 58;
  const P = (deg, r = R) => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];
  const arc = (a0, a1, r = R) => {
    const [x0, y0] = P(a0, r), [x1, y1] = P(a1, r);
    return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  };
  let body = `<circle class="g-face" cx="75" cy="75" r="70"/>`;
  const label = fmt(st.label), note = st.note ? fmt(st.note) : "";
  if (st.type === "level") {
    const scale = list(st.scale).length ? st.scale : ["A1", "A2", "B1", "B2", "C1", "C2"];
    const cur = plain(st.value).trim().toUpperCase();
    const idx = scale.findIndex((s) => String(s).toUpperCase() === cur);
    const n = scale.length, span = 270 / n;
    scale.forEach((s, i) => {
      const a0 = 135 + i * span + 2, a1 = 135 + (i + 1) * span - 2;
      body += `<path class="g-seg${i <= idx ? " on" : ""}" d="${arc(a0, a1, 56)}"/>`;
      const [tx_, ty_] = P((a0 + a1) / 2, 40);
      body += `<text class="g-num" x="${tx_.toFixed(1)}" y="${(ty_ + 3).toFixed(1)}" text-anchor="middle">${esc(s)}</text>`;
    });
    body += `<text class="g-big" x="75" y="86">${svgTxt(st.value)}</text><text class="g-cap" x="75" y="104">LEVEL</text>`;
  } else {
    const max = Number(st.max) || 4, v = Math.max(0, Math.min(max, num(st.value) || 0));
    const dec = Number.isFinite(st.decimals) ? st.decimals : 2;
    const steps = max <= 5 ? max * 2 : 10;
    for (let i = 0; i <= steps; i++) {
      const a = 135 + 270 * i / steps, major = max <= 5 ? i % 2 === 0 : i % 2 === 0;
      const [x0, y0] = P(a, major ? 60 : 63), [x1, y1] = P(a, 69);
      body += `<line class="g-tick${major ? " major" : ""}" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"/>`;
      if (major) {
        const [nx, ny] = P(a, 49);
        const val = max * i / steps;
        body += `<text class="g-num" x="${nx.toFixed(1)}" y="${(ny + 3).toFixed(1)}" text-anchor="middle">${Number.isInteger(val) ? val : val.toFixed(1)}</text>`;
      }
    }
    const av = 135 + 270 * (v / max);
    if (v > 0) body += `<path class="g-arc" d="${arc(135, Math.max(135.5, av), 64)}"/>`;
    body += `<line class="g-needle" style="--a:${(av).toFixed(1)}deg" x1="75" y1="75" x2="128" y2="75"/><circle class="g-hub" cx="75" cy="75" r="4.5"/>`;
    const shown = Number.isFinite(num(st.value)) ? num(st.value).toFixed(dec) : plain(st.value);
    body += `<text class="g-val" x="75" y="112">${hasPh(st.value) ? (PH++, `<tspan class="ph-t">${esc(shown)}</tspan>`) : esc(shown)}</text><text class="g-cap" x="75" y="125">/ ${max.toFixed(dec > 0 ? Math.min(dec, 2) : 0)}</text>`;
  }
  return `<div class="gauge"><svg viewBox="0 0 150 150" role="img" aria-label="${esc(plain(st.label))}: ${esc(plain(st.value))}">${body}</svg><span class="lbl">${label}</span>${note ? `<span class="note">${note}</span>` : ""}</div>`;
}

const RENDER = {
  preflight() {
    const stats = list(C.stats), skills = list(C.skills);
    if (!tx(C.about) && !stats.length && !skills.length) return "";
    const cl = skills.length ? `<aside class="checklist" aria-label="${esc(U().checklist)}">
        <header><span>SKILLS CHECKLIST${LANG === "th" ? `<span class="th">${esc(U().checklist)}</span>` : ""}</span><span>✓ COMPLETE</span></header>

      </aside>` : "";
    return `<div class="pf"><div>${tx(C.about) ? `<p class="about">${fmt(C.about)}</p>` : ""}
      ${stats.length ? `<div class="gauges">${stats.map(gauge).join("")}</div>` : ""}</div>${cl}</div>`;
  },
  taxi() {
    const ed = list(C.education);
    if (!ed.length) return "";
    return `<div class="taxi">${ed.map((e, i) => `<article class="taxi-item"><span class="sign" aria-hidden="true">${String.fromCharCode(65 + i)}</span>
      <div class="yrs">${fmt(e.years)}</div><h3>${fmt(e.title)}</h3><div class="place">${fmt(e.place)}</div>${e.detail ? `<p class="detail">${fmt(e.detail)}</p>` : ""}</article>`).join("")}</div>`;
  },
  takeoff() {
    const w = C.whyAviation || {};
    const pts = list(w.points);
    if (!tx(w.text) && !pts.length) return "";
    return `${tx(w.text) ? `<p class="why">${fmt(w.text)}</p>` : ""}
      ${pts.length ? `<div class="calls">${pts.map((p) => `<div class="call"><div class="c">${esc(p.call || "")}</div><h3>${fmt(p.title)}</h3><p>${fmt(p.text)}</p></div>`).join("")}</div>` : ""}`;
  },
  climb() {
    const lg = list(C.logbook), gal = list(C.gallery);

    const L = U().log;
    const total = lg.reduce((s, r) => s + (Number(r.hours) || 0), 0);
    const table = lg.length ? `<div class="logwrap"><table class="log"><thead><tr>
        <th>DATE<small>${esc(L.date)}</small></th><th>ACTIVITY<small>${esc(L.act)}</small></th><th>ORGANIZER<small>${esc(L.org)}</small></th>
        <th>ROLE<small>${esc(L.role)}</small></th><th class="n">HRS<small>${esc(L.hrs)}</small></th><th>REMARKS<small>${esc(L.rem)}</small></th></tr></thead><tbody>
        ${lg.map((r, i) => `<tr><td class="d" data-l="${esc(L.date)}">${fmt(r.date)}</td><td class="t" data-l="${esc(L.act)}">${fmt(r.title)}</td>
          <td data-l="${esc(L.org)}">${fmt(r.org)}</td><td data-l="${esc(L.role)}">${fmt(r.role)}</td>
          <td class="n" data-l="${esc(L.hrs)}">${Number(r.hours) ? Number(r.hours).toFixed(0) : "–"}</td>
          <td data-l="${esc(L.rem)}">${fmt(r.remarks)}${r.image ? `<br><button type="button" class="icon-btn" data-lb-src="${esc(r.image)}" data-lb-cap="${esc(plain(r.title))}">${ICON.photo}${esc(L.photo)}</button>` : ""}</td></tr>`).join("")}
        </tbody><tfoot><tr><td colspan="4">TOTAL HOURS${LANG === "th" ? ` <span class="th">· ${esc(L.total)}</span>` : ""}</td><td class="n">${total.toFixed(0)}</td><td></td></tr></tfoot></table></div>` : "";
    const g = gal.length ? `<h3 class="sub">${esc(U().gallery)}</h3><div class="gal">${gal.map((p) =>
        `<button type="button" class="shot" data-lb-src="${esc(p.src)}" data-lb-cap="${esc(plain(p.caption))}">${img(p.src, plain(p.caption), "photo")}<span>${fmt(p.caption)}</span></button>`).join("")}</div>` : "";
    return table + g;
  },
  cruise() {
    const pr = list(C.projects), aw = list(C.awards);
    if (!pr.length && !aw.length) return "";
    const feat = pr.filter((p) => p.featured), rest = pr.filter((p) => !p.featured);
    const media = (p) => {
      if (p.airi) {
        return `<div class="feature-media" data-airi-media data-src="${esc(p.image || "")}"><div class="gridbg"></div>

// ---------------------------------------------------------------- นำทาง + เครื่องบินบนแผนการบิน
let navTick = false;
function updateNav() {
  const links = $$("#fpl a");
  if (!links.length) return;
  const secs = links.map((a) => document.getElementById(a.dataset.sec)).filter(Boolean);
  const y = window.scrollY + 110;
  let cur = -1;
  secs.forEach((s, i) => { if (s.offsetTop <= y) cur = i; });
  links.forEach((a, i) => { a.classList.toggle("on", i === cur); a.classList.toggle("done", i < cur); if (i === cur) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current"); });
  const plane = $("#plane"), ol = $("#fpl");
  if (plane && ol) {
    const pts = links.map((a) => a.parentElement.offsetLeft + a.parentElement.offsetWidth / 2);
    let x = pts[0];
    if (cur >= 0) {
      const s = secs[cur], next = secs[cur + 1];
      const frac = next ? Math.max(0, Math.min(1, (y - s.offsetTop) / Math.max(1, next.offsetTop - s.offsetTop))) : 0;
      x = pts[cur] + (pts[Math.min(cur + 1, pts.length - 1)] - pts[cur]) * frac;
    }
    plane.style.left = x + "px";
  }
  const fpl = $(".fpl");
  const on = $("#fpl a.on");
  if (on && fpl.scrollWidth > fpl.clientWidth) fpl.scrollLeft = on.parentElement.offsetLeft - fpl.clientWidth / 2;
}
window.addEventListener("scroll", () => { if (!navTick) { navTick = true; requestAnimationFrame(() => { navTick = false; updateNav(); }); } }, { passive: true });
window.addEventListener("resize", () => updateNav());

function goTo(id, flash = true) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  if (flash) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
}

// ---------------------------------------------------------------- ปุ่มต่างๆ
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-open-airi]");
  if (t) { e.preventDefault(); openAiri(); return; }
  const lb = e.target.closest("[data-lb-src]");
  if (lb) { openLightbox(lb.dataset.lbSrc, lb.dataset.lbCap); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) { copyText(cp); return; }
  const lang = e.target.closest("#langSeg [data-lang]");
  if (lang) { LANG = lang.dataset.lang; store.set("lang", LANG); render(); return; }
});
function copyText(btn) {
  const text = btn.dataset.copy;
  const done = (ok) => {
    const s = $("span", btn);
    if (s) { s.textContent = ok ? U().copied : U().selectHint; setTimeout(() => { s.textContent = U().copy; }, 1800); }
  };
  const selectIt = () => {
    const v = btn.closest(".freq")?.querySelector(".v");
    if (v) { const r = document.createRange(); r.selectNodeContents(v); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    done(false);
  };
  try {
    navigator.clipboard.writeText(text).then(() => done(true), selectIt);
  } catch (e) { selectIt(); }
}
function openLightbox(src, cap) {
  const box = $("#lb");
  const im = $("#lbImg");
  if (!src) return;
  const pre = new Image();
  pre.onload = () => {
    im.src = src;
    im.alt = cap || "";
    $("#lbCap").textContent = cap || "";
    box.hidden = false;
    $("#lbX").focus();
  };
  pre.src = src;
}
$("#lbX").onclick = () => { $("#lb").hidden = true; };
$("#lb").addEventListener("click", (e) => { if (e.target.id === "lb") $("#lb").hidden = true; });

// ---------------------------------------------------------------- ฉากรันเวย์ตอนบินเข้าลงจอด + HUD
let hero = null;
function startHero() {
  const cv = $("#hudCanvas");
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, stars = [], city = [], visible = true, last = 0;
  const t0 = performance.now();
  const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  function size() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: Math.round(W * H / 5200) }, () => ({ x: rnd() * W, y: rnd() * H * 0.5, r: rnd() * 1.2 + 0.2, p: rnd() * 6.28, s: 0.6 + rnd() * 1.6 }));
    city = Array.from({ length: Math.round(W / 6) }, () => ({ x: rnd() * W, d: rnd(), c: rnd() }));
  }
  const day = () => document.documentElement.getAttribute("data-panel") === "day";
  function draw(t) {
    const D = day();
    const hud = D ? "rgba(6,105,140,.9)" : "rgba(110,235,255,.92)";
    const hudSoft = D ? "rgba(6,105,140,.45)" : "rgba(110,235,255,.42)";
    const cx = W * (W > 900 ? 0.465 : 0.5), hy = H * 0.3;
    const f = 1.55 * Math.max(W, 760), camH = 31, z0 = 600, z1 = 3600;
    const roll = Math.sin(t * 0.32) * 0.011 + Math.sin(t * 0.11) * 0.006;
    const bob = Math.sin(t * 0.7) * 1.6;
    ctx.clearRect(0, 0, W, H);
    // ท้องฟ้า
    const g = ctx.createLinearGradient(0, 0, 0, H);
    if (D) { g.addColorStop(0, "#8ebfe6"); g.addColorStop(0.4, "#d9ebf8"); g.addColorStop(0.41, "#c5d1da"); g.addColorStop(1, "#aab8c3"); }
    else { g.addColorStop(0, "#02060f"); g.addColorStop(0.38, "#0c1d3a"); g.addColorStop(0.41, "#060d1a"); g.addColorStop(1, "#03070f"); }
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(cx, hy + bob); ctx.rotate(roll); ctx.translate(-cx, -hy);
    if (!D) {
      for (const s of stars) {
        const a = 0.35 + 0.35 * Math.sin(t * s.s + s.p);
        ctx.fillStyle = `rgba(220,235,255,${a.toFixed(3)})`;
        ctx.fillRect(s.x, s.y, s.r, s.r);
      }
      const glow = ctx.createRadialGradient(cx, hy, 0, cx, hy, W * 0.6);
      glow.addColorStop(0, "rgba(255,170,90,.16)"); glow.addColorStop(1, "rgba(255,170,90,0)");
      ctx.fillStyle = glow; ctx.fillRect(-W, hy - H, W * 3, H * 1.2);
      for (const c of city) {
        const y = hy + 2 + c.d * c.d * 16;
        ctx.fillStyle = c.c > 0.7 ? "rgba(255,200,120,.55)" : "rgba(255,236,200,.35)";
        ctx.fillRect(c.x, y, 1.4, 1.2);
      }
    }
    const X = (x, z) => cx + f * x / z, Y = (z) => hy + f * camH / z;
    // พื้นรันเวย์
    ctx.beginPath();
    ctx.moveTo(X(-22.5, z0), Y(z0)); ctx.lineTo(X(22.5, z0), Y(z0)); ctx.lineTo(X(22.5, z1), Y(z1)); ctx.lineTo(X(-22.5, z1), Y(z1)); ctx.closePath();
    ctx.fillStyle = D ? "rgba(70,80,92,.85)" : "rgba(14,22,36,.95)"; ctx.fill();
    // แถบเปียโนหัวรันเวย์ + เส้นกลาง
    ctx.fillStyle = D ? "rgba(255,255,255,.85)" : "rgba(200,215,235,.22)";
    for (let i = 0; i < 8; i++) for (const side of [-1, 1]) {
      const x0 = side * (3 + i * 2.3), x1 = x0 + side * 1.6;
      ctx.beginPath(); ctx.moveTo(X(x0, z0 + 6), Y(z0 + 6)); ctx.lineTo(X(x1, z0 + 6), Y(z0 + 6)); ctx.lineTo(X(x1, z0 + 66), Y(z0 + 66)); ctx.lineTo(X(x0, z0 + 66), Y(z0 + 66)); ctx.fill();
    }
    ctx.strokeStyle = D ? "rgba(255,255,255,.8)" : "rgba(200,215,235,.28)";
    for (let z = z0 + 120; z < z1; z += 50) { ctx.lineWidth = Math.max(0.5, f * 0.9 / z); ctx.beginPath(); ctx.moveTo(X(0, z), Y(z)); ctx.lineTo(X(0, z + 30), Y(z + 30)); ctx.stroke(); }
    const light = (x, z, col, k = 1) => {
      const y = Y(z), px = X(x, z);
      if (y > H + 4 || px < -10 || px > W + 10) return;
      const r = Math.max(0.6, Math.min(5, f * 0.32 * k / z));
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(px, y, r, 0, 6.283); ctx.fill();
      if (!D && r > 1.2) { ctx.globalAlpha = 0.18; ctx.beginPath(); ctx.arc(px, y, r * 3, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1; }
    };
    const edge = D ? "rgba(255,255,240,.9)" : "rgba(255,244,214,.95)";
    for (let z = z0; z <= z1; z += 60) { light(-23.5, z, edge); light(23.5, z, edge); }
    for (let x = -21; x <= 21; x += 3) { light(x, z0 - 2, D ? "rgba(40,200,120,.9)" : "rgba(80,255,150,.95)"); light(x, z1 + 2, D ? "rgba(220,60,60,.9)" : "rgba(255,80,80,.9)"); }
    // ไฟนำร่อง + ไฟวิ่ง (rabbit)
    const bars = [];
    for (let d = 30; d <= 900; d += 30) bars.push(z0 - d);
    for (const z of bars) {
      if (z < 25) continue;
      for (const x of [-4, -2, 0, 2, 4]) light(x, z, edge, 0.9);
      if (Math.abs(z0 - z - 300) < 1) for (let x = -15; x <= 15; x += 2.5) light(x, z, edge, 0.9);
    }
    const seq = ((t * 2) % 1);
    const vis = bars.filter((z) => z >= 25 && Y(z) < H + 4);
    if (vis.length && !D) {
      const k = Math.floor((1 - seq) * vis.length);
      const z = vis[Math.min(vis.length - 1, Math.max(0, k))];
      ctx.shadowColor = "rgba(255,255,255,.9)"; ctx.shadowBlur = 18;
      light(0, z, "rgba(255,255,255,1)", 2.4);
      ctx.shadowBlur = 0;
    }
    // PAPI (ขาว 2 แดง 2 = อยู่บนแนวร่อนพอดี)
    const papi = ["#fff8e8", "#fff8e8", "#ff4a4a", "#ff4a4a"];
    papi.forEach((c, i) => light(-(40 + (3 - i) * 9), z0 + 300, c, 1.5));
    ctx.restore();

    // ---------- สัญลักษณ์ HUD
    ctx.save();
    ctx.strokeStyle = hud; ctx.fillStyle = hud; ctx.lineWidth = 1.4;
    ctx.font = `500 11px "IBM Plex Mono", monospace`;
    ctx.translate(cx, hy + bob); ctx.rotate(roll);
    const deg = f * Math.tan(Math.PI / 180);
    const hl = Math.min(W * 0.3, 380);
    ctx.beginPath(); ctx.moveTo(-hl, 0); ctx.lineTo(-60, 0); ctx.moveTo(60, 0); ctx.lineTo(hl, 0); ctx.stroke();
    for (const p of [-10, -5, 5, 10]) {
      const y = -p * deg, w = p % 10 === 0 ? 70 : 48;

  }
  const r = best.a(L) || {};
  return { L, t: r.t || "", html: r.html, go: r.go && sections().concat(["awards"]).includes(r.go) ? r.go : "", chips: r.chips, autoGo: wantsNav && r.go, id: best.id };
}
// ป้าย "พาไปดู" ใช้ชื่อหัวข้อตามภาษา
const goLabel = (id, L) => (id === "awards" ? UI[L].awards : UI[L].navShort[id] || id);

// ---------------------------------------------------------------- หน้าจอไอริ
const AW = { open: false, busy: false, voice: false, typer: null, bars: null, glitchT: null };
const SUGGEST = {
  th: ["แนะนำตัวหน่อย", "ทำไมอยากเรียนการบิน", "มีผลงานอะไรบ้าง", "เรียนที่ไหน", "เป้าหมายในอนาคต", "ติดต่อยังไง", "ไอริคือใคร"],
  en: ["Introduce yourself", "Why aviation?", "What projects?", "Where do you study?", "Future goals", "How to contact?", "Who is Airi?"],
};
function setState(s) {
  const map = { idle: ["ONLINE", "#00f0ff"], think: ["PROCESSING", "#ffc400"], talk: ["TRANSMITTING", "#ff2bd6"] };
  const [label, col] = map[s] || map.idle;
  $("#hudState").textContent = `AIRI.EXE // ${label}`;
  $("#hudDot").style.background = col;
  $("#hudDot").style.color = col;
  clearInterval(AW.bars);
  const bars = $$("#bars i");
  if (s === "talk") {
    AW.bars = setInterval(() => { const lv = Math.floor(3 + Math.random() * 7); bars.forEach((b, i) => { b.style.opacity = (bars.length - 1 - i) < lv ? "0.95" : "0.18"; }); }, 90);
  } else bars.forEach((b, i) => { b.style.opacity = i > bars.length - 3 ? "0.6" : "0.18"; });
}
function chips(L) {
  const box = $("#chips");
  box.innerHTML = (SUGGEST[L] || SUGGEST.th).map((c) => `<button type="button" class="chip">${esc(c)}</button>`).join("");
}
function addMsg(who, html, go, L) {
  const log = $("#log");
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.innerHTML = (who === "ai" ? '<span class="who">AIRI</span>' : "") + html
    + (go ? `<br><button type="button" class="goto" data-go="${esc(go)}">${ICON.go}${esc(L === "en" ? "Take me to " : "พาไปดู ")}${esc(goLabel(go, L))}</button>` : "");
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}
const segs = (s) => { try { return Array.from(new Intl.Segmenter(undefined, { granularity: "grapheme" }).segment(s), (x) => x.segment); } catch (e) { return Array.from(s); } };
function typeOut(text, done) {
  const box = $("#sub");
  const parts = segs(text);
  clearInterval(AW.typer);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { box.textContent = text; done(); return; }
  let i = 0;
  box.textContent = "";
  setState("talk");
  AW.typer = setInterval(() => {
    i = Math.min(parts.length, i + 2);
    box.textContent = parts.slice(0, i).join("");
    box.scrollTop = box.scrollHeight;
    if (i >= parts.length) { clearInterval(AW.typer); setTimeout(() => setState("idle"), 300); done(); }
  }, 28);
}
function speak(text, L) {
  if (!AW.voice || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu, ""));
    u.lang = L === "en" ? "en-US" : "th-TH";
    const v = speechSynthesis.getVoices().find((x) => x.lang && x.lang.toLowerCase().startsWith(L === "en" ? "en" : "th"));
    if (v) u.voice = v;
    u.pitch = 1.25; u.rate = 1.02;
    speechSynthesis.speak(u);
  } catch (e) { /* อ่านออกเสียงไม่ได้ก็ข้ามไป */ }
}
function ask(q) {
  const text = String(q || "").trim().slice(0, 300);
  if (!text || AW.busy) return;
  AW.busy = true;
  addMsg("me", esc(text));
  const r = answer(text);
  const L = r ? r.L : LANG;
  setState("think");
  $("#sub").innerHTML = '<span class="typing" aria-label="กำลังพิมพ์"><i></i><i></i><i></i></span>';
  const reply = r ? r.t : "";
  const delay = 380 + Math.min(1100, reply.length * 9);
  setTimeout(() => {
    const plainReply = reply.replace(/\[([^\]]*)\]/g, "$1");
    typeOut(plainReply, () => {
      const html = r && r.html ? r.html : (r ? fmtText(reply) : "");
      addMsg("ai", html, r && r.go, L);
      AW.busy = false;
      if (r && r.chips) chips(L);
      if (r && r.autoGo) setTimeout(() => goFrom(r.go), 500);
    });
    speak(plainReply, L);
  }, delay);
}
function fmtText(s) { return esc(s).replace(/\[([^\]]+)\]/g, (_m, x) => `<span class="ph" title="${esc(U().phTip)}">${x}</span>`); }
function goFrom(id) {
  if (window.innerWidth < 900) closeAiri();
  goTo(id);
}
function greet() {
  const L = LANG;
  const g = String(tx(A.greeting, L) || (L === "en" ? "Hi, I'm Airi! Ask me anything about {owner}." : "สวัสดีค่ะ หนูชื่อไอริ ถามเรื่อง{owner}ได้เลยนะคะ")).replace(/\{owner\}/g, owner(L));
  const ghtml = fmtText(String(tx(A.greeting, L) || g).replace(/\{owner\}/g, String(tx(A.ownerCall || "", L))));
  typeOut(g, () => addMsg("ai", ghtml, "", L));
}
function openAiri() {
  const box = $("#airi");
  if (AW.open) { $("#askInput").focus(); return; }
  AW.open = true;
  box.classList.add("open");
  $("#panel").hidden = false;
  $("#launch").setAttribute("aria-expanded", "true");
  $("#bubble").hidden = true;
  if (!$("#log").children.length) { chips(LANG); greet(); }
  setTimeout(() => $("#askInput").focus({ preventScroll: true }), 60);
  glitchLoop();
}
function closeAiri() {
  AW.open = false;
  $("#airi").classList.remove("open");
  $("#panel").hidden = true;
  $("#launch").setAttribute("aria-expanded", "false");
  clearTimeout(AW.glitchT);
  try { speechSynthesis.cancel(); } catch (e) { /* ignore */ }
  $("#launch").focus({ preventScroll: true });
}
function glitchLoop() {
  clearTimeout(AW.glitchT);
  if (!AW.open || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  AW.glitchT = setTimeout(() => { const f = $("#feed"); f.classList.add("glitch"); setTimeout(() => f.classList.remove("glitch"), 200); glitchLoop(); }, 5000 + Math.random() * 6000);
}
const bubbleText = (L) => (L === "en" ? `Hi! I'm Airi. Ask me anything about ${owner("en")} ✈️` : `สวัสดีค่ะ หนูไอริเอง มีอะไรอยากรู้เกี่ยวกับ${owner("th")} ถามหนูได้นะคะ ✈️`);
function airiI18n() {
  if (!$("#bubble").hidden) $("#bubbleTxt").textContent = bubbleText(LANG);
  $("#askInput").placeholder = U().ask;
  $("#askLbl").textContent = U().send;
  $("#launchSub").textContent = U().launch;
  $("#voiceBtn").title = U().voice;
  if (AW.open && !AW.busy) chips(LANG);
}
function initAiri() {
  const src = A.image || "images/airi.png";
  const face = $("#faceImg"), big = $("#airiImg");
  face.src = src; big.src = src;
  const silhouette = '<svg viewBox="0 0 200 220" style="position:absolute;left:50%;bottom:0;height:92%;transform:translateX(-50%)" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00f0ff" stop-opacity=".55"/><stop offset="1" stop-color="#ff2bd6" stop-opacity=".25"/></linearGradient></defs><circle cx="100" cy="70" r="42" fill="url(#sg)"/><path d="M20 220c6-58 40-92 80-92s74 34 80 92z" fill="url(#sg)"/></svg>';
  big.addEventListener("error", () => { big.insertAdjacentHTML("afterend", silhouette); big.remove(); }, { once: true });
  face.addEventListener("error", () => { face.remove(); }, { once: true });
  $("#bars").innerHTML = "<i></i>".repeat(10);
  setState("idle");
  $("#launch").onclick = openAiri;
  $("#closeBtn").onclick = closeAiri;
  $("#ask").addEventListener("submit", (e) => { e.preventDefault(); const v = $("#askInput").value; $("#askInput").value = ""; ask(v); });
  $("#chips").addEventListener("click", (e) => { const c = e.target.closest(".chip"); if (c) ask(c.textContent); });
  $("#log").addEventListener("click", (e) => { const g = e.target.closest("[data-go]"); if (g) goFrom(g.dataset.go); });
  if ("speechSynthesis" in window) {
    $("#voiceBtn").hidden = false;
    $("#voiceBtn").onclick = () => { AW.voice = !AW.voice; $("#voiceBtn").setAttribute("aria-pressed", String(AW.voice)); if (!AW.voice) try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } };
  }
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("#lb").hidden) { $("#lb").hidden = true; return; }
    if (AW.open) closeAiri();
  });
  const tick = () => { const d = new Date(); $("#hudClock").textContent = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
  tick(); setInterval(tick, 15000);
  // ทักทายเล็กๆ ครั้งแรกที่เปิดเว็บ
  let seen = false;
  try { seen = sessionStorage.getItem("fdp:bubble") === "1"; } catch (e) { /* ignore */ }
  if (!seen) {
    setTimeout(() => {
      if (AW.open) return;
      $("#bubbleTxt").textContent = bubbleText(LANG);
      $("#bubble").hidden = false;
    }, 2200);
  }
  $("#bubbleX").onclick = () => { $("#bubble").hidden = true; try { sessionStorage.setItem("fdp:bubble", "1"); } catch (e) { /* ignore */ } };
  $("#bubbleTxt").onclick = openAiri;
}

// ---------------------------------------------------------------- เริ่ม
const savedPanel = store.get("panel");
if (savedPanel === "day") document.documentElement.setAttribute("data-panel", "day");
$("#panelSwitch").setAttribute("aria-pressed", String(savedPanel === "day"));
$("#panelLbl").textContent = savedPanel === "day" ? "DAY" : "NIGHT";
render();
hero = startHero();
initAiri();
if (location.hash && document.getElementById(location.hash.slice(1))) setTimeout(() => goTo(location.hash.slice(1), false), 50);
window.__airi = { answer, ask, openAiri };
})();
</script>
